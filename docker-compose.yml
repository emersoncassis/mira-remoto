services:
  mira-remoto:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      PRESENTER_KEY: ${PRESENTER_KEY:?defina PRESENTER_KEY}
      PROTEGER: ${PROTEGER:-1}
      MARCA: ${MARCA:-CONFIDENCIAL}
      BASE_PATH: ${BASE_PATH:-}
      UPLOADS_DIR: /data/uploads
      LIMITE_ENVIOS: ${LIMITE_ENVIOS:-0}
    expose:
      - "3000"
    volumes:
      - decks-enviados:/data/uploads
    # Para adicionar decks sem rebuildar, descomente (a pasta decks/ do servidor vira a fonte):
    # volumes:
    #   - ./decks:/app/decks:ro

volumes:
  decks-enviados:
